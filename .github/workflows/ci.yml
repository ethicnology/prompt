name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: python3 tool/check_architecture.py
      - run: flutter test

  generated-code:
    name: Reproducible generated code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/data/local/prompt_database.g.dart

  stt-lab:
    name: STT lab
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/stt_lab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: Detect live STT benchmark configuration
        id: live-stt
        shell: bash
        env:
          STT_MODEL_ROOT: ${{ secrets.STT_MODEL_ROOT }}
        run: |
          if [[ -n "${STT_MODEL_ROOT}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run live STT benchmark when models are configured
        if: ${{ steps.live-stt.outputs.enabled == 'true' }}
        env:
          STT_MODEL_ROOT: ${{ secrets.STT_MODEL_ROOT }}
        run: >-
          flutter test integration_test -d flutter-tester
          --dart-define=STT_LAB_ALLOW_LIVE_TESTS=true
          --dart-define=STT_MODEL_ROOT=${STT_MODEL_ROOT}

  web-build:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release

  android-debug-apk:
    name: Android ARM64 debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Checksum APK
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prompt-android-arm64-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error

  linux-appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev xvfb
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - run: bash tool/build_appimage.sh
      - name: Smoke-test extracted AppImage
        run: |
          build/appimage/prompt-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          timeout 10s xvfb-run -a squashfs-root/AppRun || test "$?" -eq 124
      - name: Checksum AppImage
        run: sha256sum build/appimage/prompt-x86_64.AppImage > build/appimage/prompt-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prompt-linux-x86_64-appimage
          path: |
            build/appimage/prompt-x86_64.AppImage
            build/appimage/prompt-x86_64.AppImage.sha256
          if-no-files-found: error
